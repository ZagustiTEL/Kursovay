{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>📝 Регистрация нового пользователя</h2>
    
    <form method="POST">
        <div class="form-group">
            <label>👤 Имя пользователя *</label>
            <input type="text" name="username" required placeholder="Придумайте логин">
        </div>
        
        <div class="form-group">
            <label>🔒 Пароль *</label>
            <input type="password" name="password" required placeholder="Минимум 4 символа">
        </div>
        
        <div class="form-group">
            <label>🔒 Подтверждение пароля *</label>
            <input type="password" name="confirm_password" required placeholder="Повторите пароль">
        </div>
        
        <div class="form-group">
            <label>📧 Email</label>
            <input type="email" name="email" placeholder="example@mail.ru">
        </div>
        
        <div class="form-group">
            <label>👨‍💼 Полное имя</label>
            <input type="text" name="full_name" placeholder="Иванов Иван Иванович">
        </div>
        
        <div class="form-group">
            <label>📱 Телефон</label>
            <input type="tel" name="phone" placeholder="+7 XXX XXX-XX-XX">
        </div>
        
        <button type="submit" class="btn">Зарегистрироваться</button>
        <a href="/login" class="btn btn-secondary">Уже есть аккаунт? Войти</a>
    </form>
</div>
{% endblock %}
